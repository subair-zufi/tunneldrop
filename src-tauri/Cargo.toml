# NOTE: Cargo.lock pins alloc-no-stdlib = 2.0.4 to resolve a brotli transitive
# version conflict (two incompatible alloc-no-stdlib versions in one build) pulled
# in via tauri-utils. Only run `cargo update -p alloc-no-stdlib` if `cargo build`
# still passes afterward.
[package]
name = "tunneldrop"
version = "1.1.0"
edition = "2021"

[lib]
name = "tunneldrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The plugins are initialised in tunneldrop_core, but tauri-build only reads
# permission files and Android projects from this crate's direct dependencies,
# so they have to be listed here too.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
tunneldrop_core = { path = "core" }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[workspace]
members = [".", "core"]
